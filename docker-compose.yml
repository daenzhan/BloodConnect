services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: db_blood_donation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-diplom_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/db_blood_donation
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-diplom_password}
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForJWTTokenGenerationWithAtLeast32BytesLong123456789}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-tamara.kazybaeva2005@gmail.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-dhjd mree qbya hdpr}
      AI_RECOMMENDATION_BASE_URL: ${AI_SERVICE_URL:-http://localhost:8000}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
